# Render Blueprint for a single-user FeedEcho instance.
#
# Used by the "Deploy to Render" button in the README. It runs the published
# multi-arch image from GHCR (no build on Render's side) with a persistent
# disk for the SQLite database.
#
# Cost: persistent disks are not available on Render's free instance type,
# so this Blueprint uses the paid `starter` plan. Without a disk every
# redeploy or restart would wipe your feeds, accounts, and history.
#
# After the first deploy:
#   1. Open the service's Environment tab and copy FEEDECHO_AUTH_TOKEN.
#      That generated value is your login token.
#   2. Visit https://<your-service>.onrender.com and log in with it.
# The public URL (for Mastodon OAuth callbacks, poke URLs, and the secure
# cookie flag) is picked up automatically from RENDER_EXTERNAL_URL. Set
# FEEDECHO_BASE_URL only if you put a custom domain in front of the service.
#
# Upgrading: Render does not re-pull `latest` on its own. Use
# Manual Deploy > "Deploy latest reference", or change the tag below to a
# specific release (e.g. ghcr.io/jcrabapple/feedecho:1.72) to pin it.
services:
  - type: web
    name: feedecho
    runtime: image
    image:
      url: ghcr.io/jcrabapple/feedecho:latest
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: feedecho-data
      # Must match the image's VOLUME / FEEDECHO_DB_PATH directory.
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # The app listens on 8453; this tells Render where to route traffic.
      - key: PORT
        value: "8453"
      # Shared-secret login for the web UI. Generated once at creation.
      - key: FEEDECHO_AUTH_TOKEN
        generateValue: true
      # Encrypts stored third-party credentials (Mastodon/Bluesky tokens,
      # SMTP passwords...) at rest. Keep it: losing it makes stored
      # credentials unreadable and every destination has to be reconnected.
      - key: FEEDECHO_CREDENTIAL_KEY
        generateValue: true
