{% extends "base.html" %}
{% block title %}Reset password — FeedEcho{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>FeedEcho</h1>
        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% else %}
        <p class="auth-subtitle">Choose a new password.</p>
        {% endif %}
        {% if token %}
        <form method="post" action="/reset-password" class="auth-form">
            <input type="hidden" name="token" value="{{ token }}">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
            <button type="submit">Reset password</button>
        </form>
        {% else %}
        <p class="auth-alt"><a href="/forgot-password">Request a new reset link</a></p>
        {% endif %}
    </div>
</div>
{% endblock %}
