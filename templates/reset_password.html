{% extends "base.html" %}
{% block title %}Reset password — FeedEcho{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Reset your password</h1>
        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% else %}
        <p class="auth-subtitle">Choose a new password.</p>
        {% endif %}
        {% if token %}
        <form method="post" action="/reset-password" class="auth-form">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="form-row">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" class="auth-input">
            </div>
            <div class="form-row">
                <label for="confirm">Confirm new password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Repeat new password" required minlength="8" autocomplete="new-password" class="auth-input">
            </div>
            <button type="submit">Reset password</button>
        </form>
        {% else %}
        <p class="auth-alt"><a href="/forgot-password">Request a new reset link</a></p>
        {% endif %}
    </div>
</div>
{% endblock %}
