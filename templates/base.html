<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}FeedEcho{% endblock %}</title>
    <meta name="description" content="Self-hosted RSS feed cross-poster.">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17161f">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f8">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css?v=12">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
    // Set theme before first paint to avoid flash
    (function () {
        var stored = null;
        try { stored = localStorage.getItem('feedecho-theme'); } catch (e) {}
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="nav-icon" aria-hidden="true">📡</span> FeedEcho
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/feeds" class="{% if request.url.path == '/feeds' %}active{% endif %}">Feeds</a>
            <a href="/accounts" class="{% if request.url.path == '/accounts' %}active{% endif %}">Accounts</a>
            <a href="/echoes" class="{% if request.url.path == '/echoes' %}active{% endif %}">Echoes</a>
            <a href="/history" class="{% if request.url.path == '/history' %}active{% endif %}">History</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
            <a href="/howto" class="{% if request.url.path == '/howto' %}active{% endif %}">How To</a>
            {% if MULTI and is_admin %}
            <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">Admin</a>
            {% endif %}
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">◐</button>
            {% if MULTI and current_user_email %}
            <div class="nav-account">
                <span class="nav-email" title="{{ current_user_email }}">{{ current_user_email }}</span>
                <form method="post" action="/logout">
                    <button type="submit" class="nav-logout">Log out</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% if MULTI %}
    <footer class="site-footer">
        <a href="/about">About</a> · <a href="/howto">How To</a>
    </footer>
    {% endif %}
    <script src="/static/js/app.js?v=18"></script>
</body>
</html>
