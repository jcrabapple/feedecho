<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FeedEcho">
  <!--
    FeedEcho logo — RSS arcs doubling as echo waves, origin dot, delivery plane.
    Geometry hand-built from the generated brand mark; colors match the app's
    OKLCH palette (teal accent, gold warning) and dark tile (dark bg).
  -->
  <rect width="64" height="64" rx="14" fill="#1a1a24"/>
  <!-- origin dot -->
  <circle cx="18" cy="46" r="5.5" fill="#e8b84b"/>
  <!-- echo arcs: three quarter-circle waves, uniform 5px rounded strokes -->
  <g fill="none" stroke="#4ec3d4" stroke-width="5" stroke-linecap="round">
    <path d="M18 33.5 A12.5 12.5 0 0 1 30.5 46"/>
    <path d="M18 24.5 A21.5 21.5 0 0 1 39.5 46"/>
    <path d="M18 15.5 A30.5 30.5 0 0 1 48.5 46"/>
  </g>
  <!-- delivery plane: just past the outer arc, pointing outward -->
  <path d="M41 16 L54 9.5 L51.5 23 L46.5 17.5 L41 16 Z" fill="#4ec3d4"/>
</svg>
