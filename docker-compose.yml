services:
  feedecho:
    build: .
    # Or skip the local build and use the pre-built multi-arch image:
    # image: ghcr.io/jcrabapple/feedecho:latest
    # pull_policy: always
    container_name: feedecho
    restart: unless-stopped
    ports:
      - "8453:8453"
    volumes:
      - feedecho-data:/app/data
    environment:
      # Access token for the web UI. Required: an empty value disables auth
      # entirely, so compose refuses to start rather than exposing the
      # instance because of a missing .env entry.
      - FEEDECHO_AUTH_TOKEN=${FEEDECHO_AUTH_TOKEN:?set FEEDECHO_AUTH_TOKEN in .env (an empty value would leave the UI unauthenticated)}
      # Public base URL — required for Mastodon OAuth callbacks
      # e.g. https://feedecho.example.com/oauth/callback
      - FEEDECHO_CALLBACK_URL=${FEEDECHO_CALLBACK_URL:-http://localhost:8453/oauth/callback}
      # Link shown behind the "FeedEcho" application name on Mastodon posts.
      # Defaults to the project repo; set this to your own install's URL.
      - FEEDECHO_APP_WEBSITE=${FEEDECHO_APP_WEBSITE:-}

volumes:
  feedecho-data:
